name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [debug, release]
        architecture: [x64, x86]
        include:
        - build_configuration: debug
          output_directory: Debug
        - build_configuration: release
          output_directory: Release
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Install XMake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest
    - name: Configure XMake
      run: |
        xmake f -p windows -m ${{ matrix.build_configuration }} -a ${{ matrix.architecture }} -y
    - name: Build with XMake
      run: |
        xmake build
    - name: Run Tests
      run: |
        & "Build/${{ matrix.output_directory }}/${{ matrix.architecture }}/OmegaLocalization-Tests.exe"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Upload Library
      uses: actions/upload-artifact@v4
      with:
        name: OmegaLocalization-${{ matrix.build_configuration }}-${{ matrix.architecture }}
        path: Build/${{ matrix.output_directory }}/${{ matrix.architecture }}/OmegaLocalization.lib
        if-no-files-found: error
